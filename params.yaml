seed: 42

data:
  raw_dir: data/raw
  golden_path: data/golden/golden_test.parquet
  processed_dir: data/processed
  label_map: configs/label_map.yaml

sample:
  max_por_clase_train: 4000
  max_por_clase_val: 1000

split:
  val_start: "2023-11-01"

features:
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    min_df: 3

model:
  C: 1.0
  max_iter: 1000
